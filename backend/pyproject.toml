[project]
name = "marumie-backend"
version = "0.1.0"
description = "FastAPI backend for Marumie household account book"
authors = [{ name = "Marumie Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi~=0.115",
  "uvicorn[standard]~=0.32",
  "pydantic-settings~=2.5",
  "sqlalchemy~=2.0",
  "alembic~=1.13",
  "asyncpg~=0.29",
  "aiosqlite~=0.20",
  "greenlet>=2.0",
  "psycopg2-binary>=2.9.11",
  "supabase~=2.0",
  "python-dotenv~=1.0",
  "python-multipart>=0.0.21",
  "polars>=1.36.1",
]

[project.optional-dependencies]
dev = [
  "httpx~=0.27",
  "pytest~=8.3",
  "pytest-asyncio~=0.24",
  "ruff~=0.8",
]

[tool.uvicorn]
factory = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
# Python 3.11をターゲット
target-version = "py311"

# 1行の最大文字数
line-length = 88

# チェック対象外のディレクトリ
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "alembic",
]

[tool.ruff.lint]
# 有効にするルール
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

# 無効にするルール
ignore = [
    "E501",  # line-too-long (Black/Ruffのフォーマッタに任せる)
]

# 自動修正を有効化
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# isort設定
known-first-party = ["app"]
