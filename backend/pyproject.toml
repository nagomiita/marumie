[project]
name = "marumie-backend"
version = "0.1.0"
description = "FastAPI backend for Marumie household account book"
authors = [{ name = "Marumie Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi~=0.115",
  "uvicorn[standard]~=0.32",
  "pydantic-settings~=2.5",
  "sqlalchemy~=2.0",
  "alembic~=1.13",
  "aiosqlite~=0.20",
]

[project.optional-dependencies]
dev = [
  "httpx~=0.27",
  "pytest~=8.3",
  "pytest-asyncio~=0.24",
]

[tool.uvicorn]
factory = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
