# 銀行・クレジットカード明細CSV変換設定ファイル

# 銀行別設定
banks:
  # UFJ銀行 (UFJ_sample_*.csv)
  ufj:
    name: "UFJ銀行"
    encoding: "shift_jis"
    columns:
      date: "日付"
      description: "摘要"
      description_detail: "摘要内容"
      debit: "支払い金額"
      credit: "預かり金額"
      balance: "差引残高"
    file_patterns:
      - "UFJ_sample_*.csv"
    account_name: "UFJ銀行"

# 出力フォーマット設定
output:
  encoding: "utf-8-sig" # Excel対応
  # 出力列の定義（個人家計簿用にシンプル化）
  columns:
    - "日付"
    - "カテゴリ"
    - "サブカテゴリ"
    - "金額"
    - "収支区分"
    - "支払方法"
    - "摘要"
    - "メモ"

# カテゴリ分類設定（摘要から勘定科目を推定）
